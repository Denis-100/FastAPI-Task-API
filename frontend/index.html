<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="task-form">
        <h1 class="task-form__title">Мои задачи</h1>
        
        <input class="task-form__input" type="text" id="task-title" placeholder="Название задачи">
        <textarea class="task-form__input" id="task-desc" placeholder="Описание задачи"></textarea>
        
        <div class="task-form__actions">
            <button class="task-form__button" id="add-task">Добавить задачу</button>
            <button class="task-form__button" id="load-tasks">Загрузить задачи</button>
        </div>

        <ul class="task-list" id="tasks"></ul>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
